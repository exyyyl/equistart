name: Tests

on:
  push:
  pull_request:

jobs:
  unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: bash -n EquiLauncher.sh make_release.sh tests/test_autostart.sh tests/test_update.sh
      - name: Test non-disruptive autostart behavior
        run: bash tests/test_autostart.sh
      - name: Test update version comparison
        run: bash tests/test_update.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PowerShell syntax
        shell: powershell
        run: |
          $errors = @()
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "launcher.ps1"),
            [ref]$null,
            [ref]$errors
          ) | Out-Null

          # Windows PowerShell 5.1 otherwise reads this UTF-8 file as ANSI.
          $embedded = (Get-Content "EquiLauncher.bat" -Raw -Encoding UTF8) -split [regex]::Escape('<# POWERSHELL_CODE #>'), 2
          if ($embedded.Count -ne 2) {
            Write-Error "Embedded PowerShell marker not found in EquiLauncher.bat"
            exit 1
          }
          [System.Management.Automation.Language.Parser]::ParseInput(
            $embedded[1],
            [ref]$null,
            [ref]$errors
          ) | Out-Null

          if ($errors) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
      - name: Test current installer patch detection
        shell: powershell
        run: |
          $env:EQUILAUNCHER_SOURCE_ONLY = "true"
          # Windows PowerShell 5.1 treats UTF-8 without BOM as ANSI when dot-sourcing a file.
          # Decode explicitly, then dot-source the resulting script block in the current scope.
          . ([scriptblock]::Create((Get-Content "$PWD\launcher.ps1" -Raw -Encoding UTF8)))

          $appFolder = Join-Path $env:RUNNER_TEMP "discord-app"
          $resources = Join-Path $appFolder "resources"
          New-Item -ItemType Directory -Path $resources -Force | Out-Null
          New-Item -ItemType File -Path (Join-Path $resources "_app.asar") -Force | Out-Null
          $index = New-Item -ItemType File -Path (Join-Path $appFolder "index.js") -Force
          Set-Content -LiteralPath $index.FullName -Value "module.exports = require('./core.asar');"

          if (-not (Test-ModPatch -AppFolder $appFolder -Index $index -LegacyMarker "Vencord")) {
            Write-Error "Current _app.asar installation was incorrectly reported as unpatched"
            exit 1
          }
